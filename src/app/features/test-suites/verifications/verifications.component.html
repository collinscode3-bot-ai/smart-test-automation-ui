<div class="verifications-container">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-0 pt-4 px-4 d-flex align-items-center gap-2">
      <div class="bg-success bg-opacity-10 text-success rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span class="fs-5 fw-bold text-uppercase" style="color: var(--primary-color); letter-spacing: 0.05em;">Saved Verifications</span>
    </div>

    <div class="card-body p-4">
      <div class="verifications-list d-flex flex-column gap-2 mb-4">
        <div *ngFor="let verification of verifications" class="p-3 border rounded-3 d-flex justify-content-between align-items-center bg-light bg-opacity-50">
          <div class="d-flex align-items-center gap-3">
            <span class="badge bg-primary rounded-pill px-3 py-2" style="font-size: 11px;">Seq {{ verification.seq }}</span>
            <span class="fw-bold text-dark">{{ verification.name }}</span>
          </div>
          <div class="item-actions d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm p-2 rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;" (click)="onEdit(verification)" title="Edit">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn btn-outline-danger btn-sm p-2 rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;" (click)="onDelete(verification)" title="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
      </div>

      <button class="btn btn-theme-orange px-4 py-2 d-flex align-items-center gap-2" (click)="onAddVerification()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Verifications
      </button>
    </div>

    <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
      <button type="button" class="btn btn-outline-secondary px-4 py-2" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn btn-theme-purple px-4 py-2 fw-bold" (click)="saveVerifications()">Save and Proceed</button>
    </div>
  </div>

  <div class="text-center py-4 text-muted small fw-bold opacity-50" style="letter-spacing: 0.05em;">
    © 2024 Logistics Platform. All rights reserved.
  </div>
</div>
