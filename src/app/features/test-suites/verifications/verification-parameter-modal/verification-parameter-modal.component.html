<div class="modal-container">
  <div class="modal-header">
    <h1 class="modal-title">Verification Parameter Configuration</h1>
    <p class="modal-description">Define the technical parameters for the selected verification step.</p>
  </div>

  <form [formGroup]="paramForm" (ngSubmit)="onSave()" class="modal-body">
    <div class="form-grid">
      <div class="form-group">
        <label for="sequence">Param Sequence</label>
        <input type="number" id="sequence" formControlName="sequence" placeholder="e.g. 1">
      </div>
      <div class="form-group">
        <label for="key">Param Key</label>
        <input type="text" id="key" formControlName="key" placeholder="Enter key name">
      </div>

      <div class="form-group">
        <label for="valuePath">Param Value Path</label>
        <input type="text" id="valuePath" formControlName="valuePath" placeholder="Enter value path">
      </div>
      <div class="form-group">
        <label for="valueSource">Param Value Source</label>
        <input type="text" id="valueSource" formControlName="valueSource" placeholder="Enter source">
      </div>

      <div class="form-group">
        <label for="dataType">Value Data Type</label>
        <div class="select-wrapper">
          <select id="dataType" formControlName="dataType">
            <option value="" disabled selected>Select data type</option>
            <option *ngFor="let type of dataTypes" [value]="type">{{ type }}</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="value">Param Value</label>
        <input type="text" id="value" formControlName="value" placeholder="Enter value">
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn-save" [disabled]="paramForm.invalid">
        {{ isEditMode ? 'Update Parameter' : 'Save Parameter' }}
      </button>
    </div>
  </form>

  <footer class="modal-footer">
    <div class="footer-left">
      <a href="javascript:void(0)">DOCUMENTATION</a>
      <span class="separator">|</span>
      <a href="javascript:void(0)">API REFERENCE</a>
      <span class="separator">|</span>
      <a href="javascript:void(0)">SUPPORT</a>
    </div>
    <div class="footer-right">
      <span class="copyright">© 2024 Technical Verification Platform. All rights reserved.</span>
    </div>
  </footer>
</div>
