<div class="modal-container p-4">
  <div class="modal-header border-0 pb-0">
    <div>
      <h1 class="modal-title fs-5 fw-bold" style="color: var(--primary-color);">Verification Parameter Configuration</h1>
      <p class="text-muted small">Define the technical parameters for the selected verification step.</p>
    </div>
  </div>

  <form [formGroup]="paramForm" (ngSubmit)="onSave()" class="modal-body py-4">
    <div class="row g-4">
      <div class="col-md-6">
        <label for="sequence" class="form-label fw-bold small text-muted text-uppercase">Param Sequence</label>
        <input type="number" id="sequence" formControlName="sequence" class="form-control py-2" placeholder="e.g. 1">
      </div>
      <div class="col-md-6">
        <label for="key" class="form-label fw-bold small text-muted text-uppercase">Param Key</label>
        <input type="text" id="key" formControlName="key" class="form-control py-2" placeholder="Enter key name">
      </div>

      <div class="col-md-6">
        <label for="valuePath" class="form-label fw-bold small text-muted text-uppercase">Param Value Path</label>
        <input type="text" id="valuePath" formControlName="valuePath" class="form-control py-2" placeholder="Enter value path">
      </div>
      <div class="col-md-6">
        <label for="valueSource" class="form-label fw-bold small text-muted text-uppercase">Param Value Source</label>
        <input type="text" id="valueSource" formControlName="valueSource" class="form-control py-2" placeholder="Enter source">
      </div>

      <div class="col-md-6">
        <label for="dataType" class="form-label fw-bold small text-muted text-uppercase">Value Data Type</label>
        <select id="dataType" formControlName="dataType" class="form-select py-2">
          <option value="" disabled selected>Select data type</option>
          <option *ngFor="let type of dataTypes" [value]="type">{{ type }}</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="value" class="form-label fw-bold small text-muted text-uppercase">Param Value</label>
        <input type="text" id="value" formControlName="value" class="form-control py-2" placeholder="Enter value">
      </div>
    </div>

    <div class="d-flex justify-content-end gap-3 mt-5">
      <button type="button" class="btn btn-outline-secondary px-4" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn btn-theme-purple px-4" [disabled]="paramForm.invalid">
        {{ isEditMode ? 'Update Parameter' : 'Save Parameter' }}
      </button>
    </div>
  </form>

  <footer class="mt-4 pt-4 border-top d-flex justify-content-between align-items-center text-muted small fw-bold" style="letter-spacing: 0.05em;">
    <div class="d-flex gap-3">
      <a href="javascript:void(0)" class="text-decoration-none text-muted">DOCUMENTATION</a>
      <span class="opacity-25">|</span>
      <a href="javascript:void(0)" class="text-decoration-none text-muted">API REFERENCE</a>
      <span class="opacity-25">|</span>
      <a href="javascript:void(0)" class="text-decoration-none text-muted">SUPPORT</a>
    </div>
    <div class="text-end">
      <span>© 2024 Technical Verification Platform.</span>
    </div>
  </footer>
</div>
