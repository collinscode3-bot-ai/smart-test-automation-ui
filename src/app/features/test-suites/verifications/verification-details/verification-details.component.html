<div class="verification-details-container">
  <form [formGroup]="verificationForm" (ngSubmit)="onSubmit()" class="details-card">

    <div class="card-body">
      <div class="form-grid">
        <div class="form-group">
          <label>App Name</label>
          <input type="text" formControlName="appName" placeholder="Shipment Tracking">
        </div>
        <div class="form-group">
          <label>Service Name</label>
          <input type="text" formControlName="serviceName" placeholder="TrackServiceV1">
        </div>
        <div class="form-group">
          <label>Sequence No</label>
          <input type="text" formControlName="sequenceNo" placeholder="10">
        </div>
        <div class="form-group">
          <label>VerificationParamsType</label>
          <div class="select-wrapper">
            <select formControlName="verificationParamsType">
              <option value="Query Param">Query Param</option>
              <option value="Header">Header</option>
              <option value="Body">Body</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group full-width">
        <label>Base URL</label>
        <input type="text" formControlName="baseUrl" placeholder="https://api.fedex.com/track/v1">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Verify If Previous is success</label>
          <div class="toggle-group">
            <button type="button" [class.active]="verificationForm.get('verifyIfPreviousSuccess')?.value === true" (click)="toggleBoolean('verifyIfPreviousSuccess', true)">Yes</button>
            <button type="button" [class.active]="verificationForm.get('verifyIfPreviousSuccess')?.value === false" (click)="toggleBoolean('verifyIfPreviousSuccess', false)">No</button>
          </div>
        </div>
        <div class="form-group">
          <label>VerificationKeyTypeIsComposite</label>
          <div class="toggle-group">
            <button type="button" [class.active]="verificationForm.get('isCompositeKey')?.value === true" (click)="toggleBoolean('isCompositeKey', true)">Yes</button>
            <button type="button" [class.active]="verificationForm.get('isCompositeKey')?.value === false" (click)="toggleBoolean('isCompositeKey', false)">No</button>
          </div>
        </div>
      </div>

      <div class="form-group full-width">
        <label>VerificationKeyTypeDelimiter</label>
        <div class="delimiter-input-wrapper">
          <input type="text" formControlName="delimiter" placeholder=":" [readonly]="!verificationForm.get('delimiterEnabled')?.value">
          <!-- Integrated toggle switch -->
          <label class="switch">
            <input type="checkbox" formControlName="delimiterEnabled">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <!-- VERIFICATION PARAMETERS SECTION -->
      <div class="params-section">
        <div class="section-header">
          <div class="header-left">
            <div class="icon-purple">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/></svg>
            </div>
            <span>VERIFICATION PARAMETERS</span>
          </div>
        </div>
        <div class="section-content">
          <table class="params-table">
            <thead>
              <tr>
                <th>Sequence</th>
                <th>Key</th>
                <th>Path</th>
                <th>Source</th>
                <th>Value</th>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody formArrayName="parameters">
              <tr *ngFor="let param of parameters.controls; let i = index" [formGroupName]="i">
                <td>
                  <input type="number" formControlName="sequence" class="table-input" readonly>
                </td>
                <td>
                  <input type="text" formControlName="key" class="table-input" readonly>
                </td>
                <td>
                  <input type="text" formControlName="valuePath" class="table-input" readonly>
                </td>
                <td>
                  <input type="text" formControlName="valueSource" class="table-input" readonly>
                </td>
                <td>
                  <input type="text" formControlName="value" class="table-input" readonly>
                </td>
                <td class="text-right">
                  <div class="action-group">
                    <button type="button" class="action-btn edit" (click)="onEditParameter(i)" title="Edit">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button type="button" class="action-btn delete" (click)="removeParameter(i)" title="Delete">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <button type="button" class="add-param-btn" (click)="addParameter()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Verification Param
          </button>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <button type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
      <button type="submit" class="save-btn" [disabled]="verificationForm.invalid">Save Verification</button>
    </div>
  </form>

  <div class="footer-copyright">
    © 2024 FedEx Technical Platform. All rights reserved.
  </div>
</div>
