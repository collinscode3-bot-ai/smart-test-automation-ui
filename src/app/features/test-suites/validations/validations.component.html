<div class="validations-container">
  <form [formGroup]="validationForm" (ngSubmit)="saveValidation()">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <div class="row g-4">
          <div class="col-md-2">
            <label class="form-label">Sequence No</label>
            <input type="text" formControlName="sequenceNo" class="form-control py-2" placeholder="e.g. 1">
          </div>

          <div class="col-md-10">
            <label class="form-label">Validation Name</label>
            <input type="text" formControlName="validationName" class="form-control py-2" placeholder="Enter descriptive validation name">
          </div>

          <div class="col-md-3">
            <label class="form-label">Payload ID</label>
            <input type="text" formControlName="payloadId" class="form-control py-2" placeholder="e.g. REQ_12345">
          </div>

          <div class="col-md-3">
            <label class="form-label">Payload Format</label>
            <select formControlName="payloadFormat" class="form-select py-2">
              <option *ngFor="let format of payloadFormats" [value]="format">{{ format }}</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Validation Type</label>
            <select formControlName="validationType" class="form-select py-2">
              <option *ngFor="let type of validationTypes" [value]="type">{{ type }}</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Validation Source Data</label>
            <input type="text" formControlName="validationSourceData" class="form-control py-2" placeholder="Source path or query">
          </div>
        </div>
      </div>

      <!-- Error Configuration Section -->
      <div class="card-body p-4 border-top">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="d-flex align-items-center gap-2">
            <div class="bg-danger bg-opacity-10 text-danger rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <h4 class="fs-6 fw-bold mb-0 text-uppercase" style="letter-spacing: 0.05em;">ERROR CONFIGURATION</h4>
          </div>
          <button type="button" class="btn btn-theme-orange btn-sm px-3" (click)="addErrorConfiguration()">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Add Error Code
          </button>
        </div>

        <div formArrayName="errorConfigurations" class="d-flex flex-column gap-3">
          <div *ngFor="let err of errorConfigurations.controls; let i = index" [formGroupName]="i" class="p-4 border rounded-3 bg-light bg-opacity-50 position-relative">
            <div class="row g-4">
              <div class="col-md-4">
                <label class="form-label">Expected Outcome</label>
                <input type="text" formControlName="expectedOutcome" class="form-control" placeholder="Success expected">
              </div>
              <div class="col-md-4">
                <label class="form-label">Error Code</label>
                <input type="text" formControlName="errorCode" class="form-control" placeholder="e.g. ERR_VALID_01">
              </div>
              <div class="col-md-4">
                <label class="form-label">Error Message</label>
                <textarea formControlName="errorMessage" class="form-control" rows="1" placeholder="Detailed message displayed on validation failure"></textarea>
              </div>
            </div>
            <button type="button" class="btn btn-outline-danger btn-sm p-0 rounded-circle position-absolute" style="width: 24px; height: 24px; top: -10px; right: -10px; background: white;" (click)="removeErrorConfiguration(i)" *ngIf="errorConfigurations.length > 1">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Parameters Section -->
      <div class="card-body p-4 border-top">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fs-6 fw-bold mb-0 text-uppercase" style="letter-spacing: 0.05em;">PARAMETERS</h4>
          <button type="button" class="btn btn-link btn-sm text-decoration-none d-flex align-items-center gap-2" (click)="addParameter()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Add Parameter
          </button>
        </div>

        <div formArrayName="parameters" class="table-responsive rounded-3 border">
          <table class="table align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th class="ps-4 form-label">Seq No</th>
                <th class="form-label">Type</th>
                <th class="form-label">Value</th>
                <th class="form-label">Data Type</th>
                <th class="pe-4 text-end"></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let param of parameters.controls; let i = index" [formGroupName]="i">
                <td class="ps-4"><input type="number" formControlName="seqNo" class="form-control form-control-sm" style="width: 80px;"></td>
                <td><input type="text" formControlName="type" class="form-control form-control-sm" placeholder="e.g. Header"></td>
                <td><input type="text" formControlName="value" class="form-control form-control-sm" placeholder="Value string"></td>
                <td><input type="text" formControlName="dataType" class="form-control form-control-sm" placeholder="String, Int, Bool"></td>
                <td class="pe-4 text-end">
                  <button type="button" class="btn btn-outline-danger btn-sm p-1" (click)="removeParameter(i)" *ngIf="parameters.length > 1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
        <button type="button" class="btn btn-outline-secondary px-4 py-2" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-theme-purple px-4 py-2 fw-bold">Save Validation</button>
      </div>
    </div>
  </form>

  <div class="alert alert-info border-0 shadow-sm d-flex gap-3 p-4 rounded-3 bg-white mb-4">
    <div class="text-info">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    </div>
    <div class="small text-muted">
      <strong class="text-dark">Note:</strong> Changes to validations will take effect immediately in the next test execution cycle. Ensure all parameters are correctly mapped to your source data.
    </div>
  </div>
</div>
