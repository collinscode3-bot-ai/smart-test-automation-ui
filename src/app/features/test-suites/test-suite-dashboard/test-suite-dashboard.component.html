<div class="dashboard-container">

  <div class="search-section">
    <div class="search-input-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input
        type="text"
        [formControl]="searchControl"
        placeholder="Search test suites..."
        class="search-input">
    </div>
  </div>

  <div class="content-section">
    <div class="list-header">
      <h2 class="section-title">Recent Test Suites</h2>
      <app-button variant="primary" (click)="onCreateTestSuite()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Create New Test Suite
      </app-button>
    </div>

    <div class="test-suite-list">
      <div class="test-suite-card" *ngFor="let suite of paginatedSuites$ | async">
        <div class="suite-info">
          <div class="icon-box folder">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
          </div>
          <div class="text-details">
            <h3 class="suite-title">{{ suite.name }}</h3>
            <span class="type-tag" [ngClass]="suite.type.toLowerCase().replace(' ', '-')">
              {{ suite.type }}
            </span>
          </div>
        </div>
        <div class="suite-actions">
          <button class="action-btn edit-btn" (click)="onEditTestSuite(suite)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            Edit
          </button>
          <button class="action-btn delete-btn" (click)="onDeleteTestSuite(suite)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            Delete
          </button>
        </div>
      </div>

      <div class="list-divider" *ngIf="(totalPages$ | async)?.length"></div>

      <div class="pagination-container" *ngIf="(totalPages$ | async)?.length">
        <div class="pagination-controls">
          <button
            *ngFor="let page of totalPages$ | async"
            class="page-btn"
            [class.active]="currentPage === page"
            (click)="onPageChange(page)">
            {{ page }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
