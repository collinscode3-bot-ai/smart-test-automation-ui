<div class="form-container">
  <form [formGroup]="testSuiteForm" (ngSubmit)="saveSuite()">
    <div class="form-section-card">
      <div class="row">
        <div class="col-12 col-lg-10 col-xl-9">
          <!-- Main Form Fields -->
          <div class="mb-4">
            <label for="testSuiteName" class="form-label">TestSuite Name</label>
            <input
              id="testSuiteName"
              type="text"
              formControlName="testSuiteName"
              placeholder="Enter suite name (e.g. Core API Validation Suite)"
              class="form-control"
              [class.is-invalid]="testSuiteForm.get('testSuiteName')?.invalid && testSuiteForm.get('testSuiteName')?.touched">
          </div>

          <div class="mb-4">
            <label for="suiteDescription" class="form-label">Suite Description</label>
            <textarea
              id="suiteDescription"
              formControlName="suiteDescription"
              placeholder="Describe the purpose and scope of this test suite..."
              class="form-control"
              rows="5"></textarea>
          </div>

          <div class="mb-4">
            <label for="suiteType" class="form-label">Suite Type</label>
            <select
              id="suiteType"
              formControlName="suiteType"
              class="form-select"
              [class.is-invalid]="testSuiteForm.get('suiteType')?.invalid && testSuiteForm.get('suiteType')?.touched">
              <option value="" disabled selected>Select suite type</option>
              <option *ngFor="let type of suiteTypes" [value]="type">{{ type }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Test Cases Section -->
      <div class="mt-5 pt-4 border-top">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="fs-5 fw-bold mb-1" style="color: var(--primary-color);">Test Cases</h2>
            <p class="text-muted small mb-0">Add individual test cases to be executed within this suite.</p>
          </div>
          <button type="button" class="btn btn-theme-orange px-4 py-2 d-flex align-items-center gap-2" (click)="addTestCase()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Add TestCases
          </button>
        </div>

        <div class="border-2 border-dashed rounded-3 p-5 text-center bg-light" style="border-style: dashed !important;">
          <div class="empty-state">
            <div class="mb-3 text-muted">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            </div>
            <h3 class="fs-6 fw-bold mb-2">No test cases added yet</h3>
            <p class="text-muted small mb-0">Once you add test cases, they will appear here as a manageable list.</p>
          </div>
        </div>
      </div>

      <!-- Form Footer -->
      <div class="d-flex justify-content-end gap-3 mt-4 pt-4 border-top">
        <button type="button" class="btn btn-outline-secondary px-4 py-2" (click)="onCancel()">Cancel</button>
        <button
          type="submit"
          [disabled]="testSuiteForm.invalid"
          class="btn btn-theme-purple px-4 py-2 d-flex align-items-center gap-2 fw-bold">
          {{ isEditMode ? 'Update and Proceed further' : 'Save and Proceed further' }}
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </form>

  <!-- Global Footer Branding -->
  <div class="submission-footer d-flex justify-content-center align-items-center flex-wrap gap-4 mt-5 text-muted small fw-bold" style="letter-spacing: 0.1em; opacity: 0.6;">
    <span class="d-flex align-items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      SECURE SUBMISSION
    </span>
    <span class="d-flex align-items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      ENCRYPTED DATA
    </span>
    <div>© 2024 FEDEX TEST MANAGEMENT PORTAL</div>
  </div>
</div>
