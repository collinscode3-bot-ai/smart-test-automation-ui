<div class="test-data-container">
  <!-- Section 1: Data Upload Area -->
  <div class="card shadow-sm border-0 mb-4 overflow-hidden">
    <div class="card-body p-0">
      <div class="border-2 border-dashed rounded-0 p-5 text-center bg-light" style="border-style: dashed !important; cursor: pointer;" (click)="fileInput.click()">
        <div class="upload-content py-3">
          <div class="mb-3 text-muted">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div class="mb-4">
            <h3 class="fs-5 fw-bold mb-2">Click or drag file to this area to upload</h3>
            <p class="text-muted small">Support for .xlsx and .csv files. Maximum size: 10MB.</p>
          </div>
          <input
            #fileInput
            type="file"
            (change)="onFileUpload($event)"
            accept=".xlsx, .csv"
            style="display: none">
          <button class="btn btn-theme-orange px-5 py-2 fw-bold" (click)="$event.stopPropagation(); fileInput.click()">
            Browse Files
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Section 2: Data Preview Table -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <h3 class="mb-0 fs-5 fw-bold text-uppercase" style="color: var(--primary-color);">Data Preview</h3>
        <span class="badge bg-light text-dark border px-3 py-2 fw-normal" *ngIf="tableData.length > 0">{{ tableData.length }} records loaded</span>
      </div>
      <button class="btn btn-outline-danger btn-sm px-3 d-flex align-items-center gap-2" (click)="clearData()" *ngIf="tableData.length > 0">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        Clear Data
      </button>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light">
            <tr *ngIf="tableHeaders.length > 0">
              <th class="ps-4 form-label">#</th>
              <th *ngFor="let header of tableHeaders" class="form-label py-3">{{ header }}</th>
              <th class="pe-4 form-label text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of tableData; let i = index">
              <td class="ps-4 fw-bold text-muted small">{{ i + 1 }}</td>
              <td *ngFor="let key of dataKeys">
                <ng-container [ngSwitch]="key">
                  <code *ngSwitchCase="'sampleValue'" class="small">{{ row[key] }}</code>
                  <span *ngSwitchDefault class="small">{{ row[key] }}</span>
                </ng-container>
              </td>
              <td class="pe-4 text-end">
                <button class="btn btn-link btn-sm text-danger p-1" title="Delete Row">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </button>
              </td>
            </tr>
            <tr *ngIf="tableData.length === 0">
              <td [attr.colspan]="tableHeaders.length + 2" class="py-5 text-center">
                <div class="text-muted opacity-50 mb-3">
                  <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15h6"/><path d="M12 12v6"/></svg>
                </div>
                <p class="mb-0 text-muted">No data loaded. Please upload a file to preview.</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Section 3: Actions (Footer) -->
  <div class="d-flex justify-content-end gap-3 mt-4">
    <button type="button" class="btn btn-outline-secondary px-4 py-2" (click)="onCancel()">Cancel</button>
    <button type="button" class="btn btn-theme-purple px-4 py-2 fw-bold d-flex align-items-center gap-2" (click)="saveTestData()">
      {{ isEditMode ? 'Update Test Data' : 'Save Test Data' }}
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    </button>
  </div>
</div>
