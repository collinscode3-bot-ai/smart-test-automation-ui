<div class="dashboard-container">
  <!-- Search Section Card -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-4">
      <div class="search-input-wrapper position-relative">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input
          type="text"
          [formControl]="searchControl"
          placeholder="Search existing projects..."
          class="form-control ps-5 py-3 border-0 bg-light rounded-3"
          style="font-size: 16px;">
      </div>
    </div>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
      <h2 class="section-title mb-0 fs-5 fw-bold text-uppercase" style="letter-spacing: 0.05em; color: var(--primary-color);">ALL PROJECTS</h2>
      <button class="btn btn-theme-orange px-4 py-2 d-flex align-items-center gap-2" (click)="onCreateProject()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Create New Project
      </button>
    </div>

    <div class="card-body p-4" *ngIf="projects$ | async as projects; else loadingTpl">
      <ng-container *ngIf="projects.length > 0; else emptyState">
        <div class="project-list d-flex flex-column gap-3">
          <div class="project-card-item p-3 border rounded-3 d-flex justify-content-between align-items-center bg-white" *ngFor="let project of projects">
            <div class="project-info d-flex align-items-center gap-3">
              <div class="icon-box p-3 rounded-3 d-flex align-items-center justify-content-center" [ngClass]="project.iconType" style="width: 56px; height: 56px; background-color: #F3F4F6;">
                <ng-container [ngSwitch]="project.iconType">
                  <svg *ngSwitchCase="'folder'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                  <svg *ngSwitchCase="'globe'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-success"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                  <svg *ngSwitchCase="'rocket'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-danger"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-5c1.62-2.2 5-3 5-3l1 1"/><path d="M12 15v5s3.03-.55 5-2c2.2-1.62 3-5 3-5l-1-1"/></svg>
                </ng-container>
              </div>
              <div class="text-details">
                <h3 class="project-title mb-1 fs-6 fw-bold">{{ project.title }}</h3>
                <p class="project-description mb-0 text-muted small">{{ project.description }}</p>
              </div>
            </div>
            <div class="project-actions d-flex gap-2">
              <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" (click)="onEditProject(project)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                Edit
              </button>
              <button class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1" (click)="onDeleteProject(project)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                Delete
              </button>
            </div>
          </div>
        </div>

        <div class="pagination-container mt-4 d-flex justify-content-center">
          <div class="pagination-controls d-flex gap-2">
            <button class="btn btn-light rounded-circle" [class.btn-primary]="currentPage === 1" [class.text-white]="currentPage === 1" (click)="onPageChange(1)" style="width: 40px; height: 40px;">1</button>
            <button class="btn btn-light rounded-circle" [class.btn-primary]="currentPage === 2" [class.text-white]="currentPage === 2" (click)="onPageChange(2)" style="width: 40px; height: 40px;">2</button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>

<ng-template #emptyState>
  <div class="empty-state text-center py-5">
    <div class="empty-icon-large mb-3 text-muted">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h3 class="fs-5 fw-bold">No projects found</h3>
    <p class="text-muted">Try adjusting your search or create a new project.</p>
  </div>
</ng-template>

<ng-template #loadingTpl>
  <div class="loading-state text-center py-5">
    <div class="spinner-border text-primary mb-2" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-muted">Loading projects...</p>
  </div>
</ng-template>
