<div class="contract-properties-container">

  <!-- Property Configuration Card -->
  <div class="card config-card">
    <div class="card-header">
      <div class="icon-box orange">
        <!-- Settings/Tuning icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/></svg>
      </div>
      <div class="header-text">
        <h2>Property Configuration</h2>
        <p>Define schema attributes for new contract fields</p>
      </div>
    </div>

    <form [formGroup]="propertyForm" (ngSubmit)="onSubmit()" class="config-form">
      <div class="form-row">
        <div class="form-field">
          <label>PROPERTY KEY</label>
          <input type="text" formControlName="name" placeholder="e.g. tracking_number">
        </div>
        <div class="form-field">
          <label>FIELD DATA TYPE</label>
          <div class="select-wrapper">
            <select formControlName="type">
              <option value="String">String</option>
              <option value="Long">Long</option>
              <option value="Integer">Integer</option>
              <option value="Boolean">Boolean</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>FIELD VALUE TYPE</label>
          <input type="text" formControlName="valueType" placeholder="e.g. UUID, Email, Phone">
        </div>
        <div class="form-field">
          <label>FIELD FORMAT</label>
          <input type="text" formControlName="format" placeholder="e.g. YYYY-MM-DD">
        </div>
      </div>

      <div class="form-row align-bottom">
        <div class="form-field">
          <label>FIELD GENERATION TYPE</label>
          <input type="text" formControlName="generationType" placeholder="Random">
        </div>
        <div class="toggle-group">
          <!-- Mandatory Toggle -->
          <div class="toggle-item">
            <span class="toggle-label">MANDATORY</span>
            <label class="switch">
              <input type="checkbox" formControlName="isMandatory">
              <span class="slider round"></span>
            </label>
          </div>
          <!-- Auto-Gen Toggle -->
          <div class="toggle-item">
            <span class="toggle-label">AUTO-GEN</span>
            <label class="switch">
              <input type="checkbox" formControlName="isAutoGenerated">
              <span class="slider round"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="save-btn" [disabled]="propertyForm.invalid">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          SAVE PROPERTIES
        </button>
      </div>
    </form>
  </div>

  <!-- Saved Properties List Area -->
  <div class="saved-properties-section">
    <div class="section-header">
      <div class="title-with-bar">
        <h3>Saved Properties</h3>
      </div>
      <span class="badge">{{ savedProperties.length }} REGISTERED</span>
    </div>

    <div class="properties-list">
      <div *ngFor="let prop of savedProperties" class="property-item" (click)="onEdit(prop)">
        <div class="item-icon-box">
          <!-- Dynamic Icons based on property name for demo -->
          <svg *ngIf="prop.name === 'user_id'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <svg *ngIf="prop.name === 'contact_email'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
          <svg *ngIf="prop.name === 'created_at' || (!['user_id', 'contact_email'].includes(prop.name))" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="item-content">
          <div class="item-title">{{ prop.name }}</div>
          <div class="item-meta">
            <span class="type-text">{{ prop.type }}</span>
            <span *ngIf="prop.format" class="separator">•</span>
            <span *ngIf="prop.format" class="format-text">{{ prop.format }}</span>
            <span *ngIf="prop.isMandatory" class="separator">•</span>
            <span *ngIf="prop.isMandatory" class="tag mandatory">MANDATORY</span>
            <span *ngIf="prop.isAutoGenerated" class="separator">•</span>
            <span *ngIf="prop.isAutoGenerated" class="tag auto-gen">AUTO-GENERATED</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
