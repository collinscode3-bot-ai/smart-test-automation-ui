<div class="contract-properties-container">

  <!-- Property Configuration Card -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-0 pt-4 px-4 d-flex align-items-center gap-3">
      <div class="p-2 rounded-3" style="background-color: #FFF7ED; color: var(--accent-color);">
        <!-- Settings/Tuning icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/></svg>
      </div>
      <div>
        <h2 class="mb-0 fs-5 fw-bold text-uppercase" style="color: var(--primary-color);">Property Configuration</h2>
        <p class="mb-0 text-muted small">Define schema attributes for new contract fields</p>
      </div>
    </div>

    <div class="card-body p-4">
      <form [formGroup]="propertyForm" (ngSubmit)="onSubmit()">
        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold small text-muted text-uppercase">PROPERTY KEY</label>
            <input type="text" formControlName="name" placeholder="e.g. tracking_number" class="form-control py-2">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small text-muted text-uppercase">FIELD DATA TYPE</label>
            <select formControlName="type" class="form-select py-2">
              <option value="String">String</option>
              <option value="Long">Long</option>
              <option value="Integer">Integer</option>
              <option value="Boolean">Boolean</option>
            </select>
          </div>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold small text-muted text-uppercase">FIELD VALUE TYPE</label>
            <input type="text" formControlName="valueType" placeholder="e.g. UUID, Email, Phone" class="form-control py-2">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small text-muted text-uppercase">FIELD FORMAT</label>
            <input type="text" formControlName="format" placeholder="e.g. YYYY-MM-DD" class="form-control py-2">
          </div>
        </div>

        <div class="row g-4 mb-4 align-items-end">
          <div class="col-md-6">
            <label class="form-label fw-bold small text-muted text-uppercase">FIELD GENERATION TYPE</label>
            <input type="text" formControlName="generationType" placeholder="Random" class="form-control py-2">
          </div>
          <div class="col-md-6">
            <div class="d-flex gap-4">
              <!-- Mandatory Toggle -->
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="isMandatory" formControlName="isMandatory">
                <label class="form-check-label fw-bold small text-muted text-uppercase" for="isMandatory">MANDATORY</label>
              </div>
              <!-- Auto-Gen Toggle -->
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="isAutoGenerated" formControlName="isAutoGenerated">
                <label class="form-check-label fw-bold small text-muted text-uppercase" for="isAutoGenerated">AUTO-GEN</label>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-theme-purple px-5 py-2 fw-bold d-flex align-items-center gap-2" [disabled]="propertyForm.invalid">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            SAVE PROPERTIES
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Saved Properties List Area -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <h3 class="mb-0 fs-5 fw-bold text-uppercase" style="color: var(--primary-color);">Saved Properties</h3>
        <div style="width: 40px; height: 3px; background-color: var(--accent-color); border-radius: 2px;"></div>
      </div>
      <span class="badge rounded-pill px-3 py-2" style="background-color: var(--primary-color); color: white;">{{ savedProperties.length }} REGISTERED</span>
    </div>

    <div class="card-body p-4">
      <div class="row g-3">
        <div *ngFor="let prop of savedProperties" class="col-12">
          <div class="property-item p-3 border rounded-3 d-flex align-items-center gap-3 bg-light-hover" (click)="onEdit(prop)" style="cursor: pointer; transition: background 0.2s;">
            <div class="item-icon-box p-3 rounded-3 bg-white shadow-sm d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; color: var(--accent-color);">
              <!-- Dynamic Icons based on property name for demo -->
              <svg *ngIf="prop.name === 'user_id'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              <svg *ngIf="prop.name === 'contact_email'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
              <svg *ngIf="prop.name === 'created_at' || (!['user_id', 'contact_email'].includes(prop.name))" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <div class="flex-grow-1">
              <div class="fw-bold mb-1" style="color: var(--text-primary);">{{ prop.name }}</div>
              <div class="d-flex align-items-center gap-2 small text-muted">
                <span>{{ prop.type }}</span>
                <span *ngIf="prop.format" class="text-secondary opacity-50">•</span>
                <span *ngIf="prop.format">{{ prop.format }}</span>
                <span *ngIf="prop.isMandatory" class="text-secondary opacity-50">•</span>
                <span *ngIf="prop.isMandatory" class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-2 py-1">MANDATORY</span>
                <span *ngIf="prop.isAutoGenerated" class="text-secondary opacity-50">•</span>
                <span *ngIf="prop.isAutoGenerated" class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-2 py-1">AUTO-GENERATED</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
