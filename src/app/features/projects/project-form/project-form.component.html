<div class="form-container">
  <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
    <div class="form-card">
      <div class="form-body">
        <div class="form-group">
          <label for="projectName">Project Name <span class="required">*</span></label>
          <input
            id="projectName"
            type="text"
            formControlName="projectName"
            placeholder="e.g. Q4 Marketing Campaign"
            class="form-control"
            [class.invalid]="projectForm.get('projectName')?.invalid && projectForm.get('projectName')?.touched">
        </div>

        <div class="form-group">
          <label for="projectDescription">Project Description</label>
          <textarea
            id="projectDescription"
            formControlName="projectDescription"
            placeholder="Describe the goals, scope, and key deliverables of this project..."
            class="form-control textarea"
            rows="6"></textarea>
          <span class="hint">Recommended: 100-200 words for clarity.</span>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
        <app-button
          type="submit"
          variant="primary"
          [showArrow]="true"
          [disabled]="projectForm.invalid"
          class="submit-btn">
          {{ isEditMode ? 'Update and Proceed Further' : 'Save and Proceed Further' }}
        </app-button>
      </div>
    </div>
  </form>
</div>
