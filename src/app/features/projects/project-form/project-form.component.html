<div class="form-container">
  <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <div class="mb-4">
          <label for="projectName" class="form-label fw-semibold text-secondary">Project Name <span class="text-danger">*</span></label>
          <input
            id="projectName"
            type="text"
            formControlName="projectName"
            placeholder="e.g. Q4 Marketing Campaign"
            class="form-control py-2"
            [class.is-invalid]="projectForm.get('projectName')?.invalid && projectForm.get('projectName')?.touched">
        </div>

        <div class="mb-4">
          <label for="projectDescription" class="form-label fw-semibold text-secondary">Project Description</label>
          <textarea
            id="projectDescription"
            formControlName="projectDescription"
            placeholder="Describe the goals, scope, and key deliverables of this project..."
            class="form-control py-2"
            rows="6"></textarea>
          <div class="form-text mt-2">Recommended: 100-200 words for clarity.</div>
        </div>
      </div>

      <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
        <button type="button" class="btn btn-outline-secondary px-4 py-2" (click)="onCancel()">Cancel</button>
        <button
          type="submit"
          [disabled]="projectForm.invalid"
          class="btn btn-theme-purple px-4 py-2 d-flex align-items-center gap-2">
          {{ isEditMode ? 'Update and Proceed further' : 'Save and Proceed further' }}
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </form>
</div>
